r block structures: https://api.slack.com/reference/block-kit/blocks","items":{"oneOf":[{"additionalProperties":false,"description":"Section block - displays text alongside optional accessories like buttons, images, or select menus","properties":{"accessory":{"description":"Interactive element (button, select, image, etc.)","order":4,"properties":{"type":{"enum":["button","static_select","external_select","users_select","conversations_select","channels_select","overflow","datepicker","timepicker","datetime_select","image"],"order":0,"type":"string"}},"required":["type"],"type":"object"},"block_id":{"description":"Optional unique identifier for the block","order":1,"type":"string"},"fields":{"description":"Array of text objects for multi-column layout (max 10)","items":{"properties":{"emoji":{"order":2,"type":"boolean"},"text":{"order":1,"type":"string"},"type":{"enum":["mrkdwn","plain_text"],"order":0,"type":"string"}},"required":["type","text"],"type":"object"},"order":3,"type":"array"},"text":{"description":"Main text content - required unless fields is provided","order":2,"properties":{"emoji":{"description":"Parse emojis (plain_text only)","order":2,"type":"boolean"},"text":{"order":1,"type":"string"},"type":{"enum":["mrkdwn","plain_text"],"order":0,"type":"string"}},"required":["type","text"],"type":"object"},"type":{"enum":["section"],"order":0,"type":"string"}},"required":["type"],"type":"object"},{"additionalProperties":false,"description":"Divider block - creates a visual divider line","properties":{"block_id":{"description":"Optional unique identifier for the block","order":1,"type":"string"},"type":{"enum":["divider"],"order":0,"type":"string"}},"required":["type"],"type":"object"},{"additionalProperties":false,"description":"Image block - displays an image","properties":{"alt_text":{"description":"Alt text for accessibility (required)","order":3,"type":"string"},"block_id":{"description":"Optional unique identifier for the block","order":1,"type":"string