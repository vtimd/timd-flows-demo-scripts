      appBlock:
        block: addIncidentNote
        appInstallation: pagerduty
        schema: '{"order":4,"name":"Add Incident Note","category":"Incident Management","description":"Adds a note to an existing PagerDuty incident","config":{},"hasOnInternalMessage":false,"inputs":{"default":{"order":0,"config":{"fromEmail":{"order":2,"name":"From Email","description":"Email address of the user adding the note (for audit trail)","type":{"type":"string"},"fixed":false,"required":true,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"incidentId":{"order":0,"name":"Incident ID","description":"The PagerDuty incident ID to add a note to","type":{"type":"string"},"fixed":false,"required":true,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"note":{"order":1,"name":"Note Content","description":"The content of the note to add","type":{"type":"string"},"fixed":false,"required":true,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false}},"hasOnEvent":true}},"outputs":{"default":{"order":0,"name":"Note Added","description":"Emitted when the note has been successfully added to the incident","default":true,"possiblePrimaryParents":["default"],"type":{"description":"Raw PagerDuty note object from API response","properties":{"content":{"description":"Note content","type":"string"},"created_at":{"description":"Creation timestamp","type":"string"},"html_url":{"description":"Note URL in PagerDuty","type":"string"},"id":{"description":"Note ID","type":"string"},"self":{"description":"API URL","type":"string"},"summary":{"description":"Note summary","type":"string"},"type":{"description":"Resource type","type":"string"},"user":{"description":"User who created the note","properties":{"html_url":{"type":"string"},"id":{"type":"string"},"self":{"type":"string"},"summary":{"type":"string"},"type":{"type":"string"}},"type":"object"}},"required":["id","type","summary","self","created_at","content"],"type":"object"}}},"signals":{},"hasOnSync":false,"hasOnDrain":false,"hasOnTimer":false,"entrypoint":false}'
        # The above schema can be used if you attempt to create this block without a valid app installation referenced.
    position: [0, 1020]
    inputs:
      default:
        links:
          - block: Post Summary to Slack
            output: default
        config:
          fromEmail: !expr secrets.PAGERDUTY_FROM_EMAIL
          incidentId: !expr outputs.incidentTriggered.data.id
          note: !expr outputs.generateIncidentSummary.text ?? ''
  - name: Create Incident Channel
    description: Creates the inc-<incident-id> Slack channel.
    type:
      appBlock:
        block: createChannel
        appInstallation: slack
        schema: '{"order":16,"name":"Create Channel","category":"Channels","description":"Creates a new Slack channel (public or private).","config":{},"hasOnInternalMessage":false,"inputs":{"default":{"order":0,"name":"Create","description":"Trigger creating a new channel.","config":{"isPrivate":{"order":1,"name":"Private Channel","description":"If true, creates a private channel. If false, creates a public channel.","type":{"type":"boolean"},"fixed":false,"required":false,"default":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"name":{"order":0,"name":"Channel Name","description":"Name of the channel to create. Must be lowercase, without spaces or periods, and shorter than 22 characters.","type":{"type":"string"},"fixed":false,"required":true,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false}},"hasOnEvent":true}},"outputs":{"default":{"order":0,"name":"Channel Created","description":"Emitted when the channel has been successfully created.","default":true,"possiblePrimaryParents":["default"],"type":{"properties":{"channel":{"description":"The created channel object.","order":0,"properties":{"created":{"description":"Unix timestamp when the channel was created.","order":5,"type":"number"},"creator":{"description":"ID of a Slack user (e.g., U0123ABC).","order":6,"type":"string"},"id":{"description":"ID of a Slack channel (e.g., C0123ABC), private group (G0123ABC), or direct message (D0123ABC).","order":0,"type":"string"},"is_channel":{"description":"True if this is a public channel.","order":2,"type":"boolean"},"is_group":{"description":"True if this is a private channel.","order":3,"type":"boolean"},"is_private":{"description":"True if this is a private channel.","order":4,"type":"boolean"},"name":{"description":"The name of the created channel.","order":1,"type":"string"}},"required":["id","name","is_channel","is_group","is_private","created","creator"],"type":"object"}},"required":["channel"],"type":"object"}}},"signals":{},"hasOnSync":false,"hasOnDrain":false,"hasOnTimer":false,"entrypoint":false}'
        # The above schema can be used if you attempt to create this block without a valid app installation referenced.
    position: [0, 680]
    inputs:
      default:
        links:
          - block: Generate Incident Summary
            output: result
        config:
          name: !expr '`inc-${outputs.incidentTriggered.data.id.toLowerCase()}`'
  - name: Fetch Datadog Monitors
    description: Lists Datadog monitors tagged with the affected service, including their state.
    type:
      appBlock:
        block: listMonitorsV1
        appInstallation: datadog
        schema: '{"order":4,"name":"List Monitors","category":"Monitors","description":"Get all monitor details from DataDog using the V1 API","config":{},"hasOnInternalMessage":false,"inputs":{"default":{"order":0,"name":"Execute List Monitors","description":"Trigger get all monitor details from datadog using the v1 api","config":{"group_states":{"order":4,"name":"Group States","description":"Filter by monitor group states","type":{"items":{"type":"string"},"type":"array"},"fixed":false,"required":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"monitor_tags":{"order":2,"name":"Monitor Tags Filter","description":"Filter monitors by monitor tags","type":{"items":{"type":"string"},"type":"array"},"fixed":false,"required":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"name":{"order":0,"name":"Name","description":"Name filter","type":{"type":"string"},"fixed":false,"required":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"page":{"order":6,"name":"Page","description":"Page number for pagination","type":{"type":"number"},"fixed":false,"required":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"page_size":{"order":5,"name":"Page Size","description":"Number of items per page (max 1000)","type":{"type":"number"},"fixed":false,"required":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"tags":{"order":1,"name":"Tags","description":"A list of tags to filter by","type":{"items":{"type":"string"},"type":"array"},"fixed":false,"required":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"with_downtimes":{"order":3,"name":"Include Downtimes","description":"Include downtime information in the response","type":{"type":"boolean"},"fixed":false,"required":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false}},"hasOnEvent":true}},"outputs":{"default":{"order":0,"name":"Result","description":"Result from get all monitor details from datadog using the v1 api","default":true,"possiblePrimaryParents":["default"],"type":{"items":{"properties":{"created":{"order":7,"type":"string"},"created_at":{"order":8,"type":"number"},"creator":{"order":10,"type":"object"},"draft_status":{"order":16,"type":"string"},"id":{"order":0,"type":"number"},"matching_downtimes":{"items":{"type":"object"},"order":17,"type":"array"},"message":{"order":4,"type":"string"},"modified":{"order":9,"type":"string"},"multi":{"order":14,"type":"boolean"},"name":{"order":1,"type":"string"},"options":{"order":6,"type":"object"},"org_id":{"order":15,"type":"number"},"overall_state":{"order":11,"type":"string"},"overall_state_modified":{"order":12,"type":"string"},"priority":{"order":13,"type":"number"},"query":{"order":3,"type":"string"},"tags":{"items":{"type":"string"},"order":5,"type":"array"},"type":{"order":2,"type":"string"}},"type":"object"},"type":"array"}}},"signals":{},"hasOnSync":false,"hasOnDrain":false,"hasOnTimer":false,"entrypoint":false}'
        # The above schema can be used if you attempt to create this block without a valid app installation referenced.
    position: [0, 340]
    inputs:
      default:
        links:
          - block: Fetch GitHub Deploys
            output: default
        config:
          monitor_tags: !expr '[`service:${(outputs.incidentTriggered.data.service?.summary || '''').toLowerCase().trim().replace(/\s+/g, ''-'')}`]'
  - name: Fetch GitHub Deploys
    description: Fetches the last five GitHub deployments for the affected service's repository.
    type:
      appBlock:
        block: httpRequest
        appInstallation: github
        schema: '{"order":32,"name":"HTTP Request","category":"Request","description":"Make a direct request to the GitHub API","config":{},"hasOnInternalMessage":false,"inputs":{"default":{"order":0,"config":{"accept":{"order":3,"name":"Accept Header","description":"Optional Accept header value","type":{"type":"string"},"fixed":false,"required":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"method":{"order":0,"name":"HTTP Method","description":"HTTP method for the request","type":{"enum":["GET","POST","PUT","PATCH","DELETE"]},"fixed":false,"required":true,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"path":{"order":1,"name":"Path","description":"The full API path (e.g., \"/repos/octocat/hello-world/issues\")","type":{"type":"string"},"fixed":false,"required":true,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"requestBody":{"order":2,"name":"Body","description":"Optional request body as key-value pairs","type":{"additionalProperties":true,"type":"object"},"fixed":false,"required":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false}},"hasOnEvent":true}},"outputs":{"default":{"order":0,"default":true,"possiblePrimaryParents":["default"],"type":{"additionalProperties":true,"type":"object"}}},"signals":{},"hasOnSync":false,"hasOnDrain":false,"hasOnTimer":false,"entrypoint":false}'
        # The above schema can be used if you attempt to create this block without a valid app installation referenced.
    position: [0, 170]
    inputs:
      default:
        links:
          - block: Incident Triggered
            output: default
        config:
          method: !expr '`GET`'
          path: !expr '`/repos/YOUR_ORG/${(outputs.incidentTriggered.data.service?.summary || '''').toLowerCase().trim().replace(/\s+/g, ''-'')}/deployments?per_page=5`'
  - name: Generate Incident Summary
    description: Uses Claude to summarize what changed (deploys) and what's alerting (monitors).
    type:
      appBlock:
        block: generateMessage
        appInstallation: anthropic
        schema: '{"order":2,"name":"Generate message","category":"Core","description":"Generates a message based on provided input and parameters.","config":{},"hasOnInternalMessage":true,"inputs":{"default":{"order":0,"config":{"force":{"order":10,"name":"Force","description":"Force the model to call a tool. Provide a name to call a specific tool or `true` to always call any tool.","type":{"anyOf":[{"description":"The name of the tool to call.","type":"string"},{"description":"Always call any tool.","type":"boolean"}]},"fixed":false,"required":false,"default":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"maxRetries":{"order":5,"name":"Max retries","description":"The number of times to retry the call if it fails to generate a valid object. Works only if schema is provided.","type":{"type":"number"},"fixed":false,"required":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"maxTokens":{"order":3,"name":"Max tokens","description":"The maximum number of tokens to generate before stopping. Note that the models may stop before reaching this maximum. This parameter only specifies the absolute maximum number of tokens to generate.","type":{"type":"number"},"fixed":false,"required":false,"default":4096,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"mcpServers":{"order":9,"name":"Remote MCP servers","description":"Array of remote MCP servers to use","type":{"items":{"properties":{"allowedTools":{"description":"Allowed tools for the MCP server","order":4,"type":"array"},"authorizationToken":{"description":"Authorization token for the MCP server","order":3,"type":"string"},"name":{"description":"Name of the MCP server","order":0,"type":"string"},"type":{"description":"Type of the MCP server","enum":["url"],"order":2,"type":"string"},"url":{"description":"URL of the MCP server","order":1,"type":"string"}},"required":["name","url","type"],"type":"object"},"type":"array"},"fixed":false,"required":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"model":{"order":0,"name":"Model","description":"The model that will complete your prompt.","type":{"type":"string"},"fixed":false,"required":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"prompt":{"order":1,"name":"Prompt","description":"The input to the model.","type":{"type":"string"},"fixed":false,"required":true,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"schema":{"order":4,"name":"Schema","description":"The JSON schema to generate the object from.","type":{"additionalProperties":true,"type":"object"},"fixed":false,"required":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"skills":{"order":12,"name":"Skills","description":"Anthropic skills to enable (e.g. pptx, xlsx, docx, pdf, or custom skill IDs).","type":{"items":{"type":"string"},"type":"array"},"fixed":false,"required":false,"hasValidator":false,"hasSuggestValues":true,"fieldKey":"","sensitive":false},"systemPrompt":{"order":2,"name":"System prompt","description":"A system prompt is a way of providing context and instructions to Claude, such as specifying a particular goal or role.","type":{"type":"string"},"fixed":false,"required":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"temperature":{"order":11,"name":"Temperature","description":"Amount of randomness injected into the response. Defaults to `1.0`. Ranges from `0.0` to `1.0`. Use temperature closer to `0.0` for analytical / multiple choice, and closer to `1.0` for creative and generative tasks. Note that even with temperature of `0.0`, the results will not be fully deterministic.","type":{"type":"number"},"fixed":false,"required":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"thinking":{"order":6,"name":"Thinking","description":"Whether to enable Claude''s extended thinking. This will make the model think more deeply and generate more detailed responses. This will also increase the cost of the request.","type":{"type":"boolean"},"fixed":false,"required":false,"default":true,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"thinkingBudget":{"order":7,"name":"Thinking budget","description":"Determines how many tokens Claude can use for its internal reasoning process. Must be ≥1024 and less than `max_tokens`.","type":{"type":"number"},"fixed":false,"required":false,"default":2048,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"toolDefinitions":{"order":8,"name":"Tools","description":"Array of tool blocks to use.\nYou can specify them like this:\n```javascript\n[signals.toolBlock.definition, ...]\n```","type":{"items":{"properties":{"blockId":{"description":"ID of the tool definition block","order":0,"type":"string"},"description":{"description":"Description of the tool","order":2,"type":"string"},"name":{"description":"Name of the tool","order":1,"type":"string"},"schema":{"description":"Schema of the tool","order":3,"type":"object"}},"required":["name","description","schema"],"type":"object"},"type":"array"},"fixed":false,"required":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false}},"hasOnEvent":true}},"outputs":{"result":{"order":0,"name":"Result","description":"The generated message","default":true,"possiblePrimaryParents":["default"],"type":{"properties":{"object":{"anyOf":[{"additionalProperties":true,"type":"object"},{"type":"null"}],"description":"The generated object if schema is provided","order":1},"text":{"description":"The generated message","order":0,"type":"string"},"usage":{"order":2,"properties":{"inputTokens":{"order":0,"type":"number"},"outputTokens":{"order":1,"type":"number"}},"type":"object"}},"required":["usage"],"type":"object"}}},"signals":{},"hasOnSync":false,"hasOnDrain":false,"hasOnTimer":true,"entrypoint":false}'
        # The above schema can be used if you attempt to create this block without a valid app installation referenced.
    position: [0, 510]
    inputs:
      default:
        links:
          - block: Fetch Datadog Monitors
            output: default
        config:
          maxTokens: 1024
          model: !expr '`claude-sonnet-4-6`'
          prompt: !expr |-
            (function() {
              const incident = outputs.incidentTriggered.data;
              const raw = outputs.fetchGithubDeploys;
              const list = Array.isArray(raw) ? raw : (raw?.body || raw?.data || []);
              const deploys = (Array.isArray(list) ? list : []).slice(0, 5).map((d) => ({
                id: d.id,
                environment: d.environment,
                ref: d.ref,
                sha: d.sha,
                description: d.description,
                creator: d.creator?.login,
                createdAt: d.created_at,
              }));
              const alerting = (outputs.fetchDatadogMonitors || [])
                .filter((m) => m.overall_state && ['Alert', 'Warn'].includes(m.overall_state))
                .map((m) => ({ name: m.name, state: m.overall_state, since: m.overall_state_modified, query: m.query }));
              return `Incident #${incident.number}: ${incident.title}
            Service: ${incident.service?.summary || 'unknown'}
            Urgency: ${incident.urgency}
            Triggered at: ${incident.created_at}
            Link: ${incident.html_url}

            Last 5 GitHub deploys (JSON):
            ${JSON.stringify(deploys, null, 2)}

            Alerting Datadog monitors (JSON):
            ${JSON.stringify(alerting, null, 2)}`;
            })()
          systemPrompt: !expr |-
            `You are an SRE assistant helping on-call engineers triage incidents. Write a concise incident summary with two sections: "What changed" (recent deploys, newest first, with environment, ref/sha, creator and time) and "What's alerting" (alerting Datadog monitors). Finish with one line on the most likely causal deploy, if any. Use plain text with simple "-" bullet lists, no headings or markdown formatting. Do not invent data; say so when a section has no data.`
  - name: Incident Triggered
