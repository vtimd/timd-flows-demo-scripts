    type:
      appBlock:
        block: incidentSubscription
        appInstallation: pagerduty
        schema: '{"order":0,"name":"Incident Subscription","category":"Subscriptions","description":"Creates a webhook subscription for a PagerDuty service to receive incident notifications","config":{"serviceId":{"order":0,"name":"Service ID","description":"The PagerDuty service ID to monitor for incidents","type":{"type":"string"},"fixed":false,"required":true,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"statuses":{"order":2,"name":"Statuses Filter","description":"Filter by incident statuses (if empty, all statuses are included)","type":{"items":{"enum":["triggered","acknowledged","resolved"],"type":"string"},"type":"array"},"fixed":false,"required":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"urgencies":{"order":1,"name":"Urgencies Filter","description":"Filter by incident urgency levels (if empty, all urgencies are included)","type":{"items":{"enum":["high","low"],"type":"string"},"type":"array"},"fixed":false,"required":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false}},"hasOnInternalMessage":false,"inputs":{},"outputs":{"default":{"order":0,"name":"Incident Event","description":"Emitted when an incident event matches the subscription filters","default":true,"possiblePrimaryParents":[],"type":{"description":"Raw PagerDuty webhook event data","properties":{"agent":{"description":"User who triggered the event","properties":{"html_url":{"type":"string"},"id":{"type":"string"},"self":{"type":"string"},"summary":{"type":"string"},"type":{"type":"string"}},"type":"object"},"client":{"description":"Client information (may be null)"},"data":{"description":"The incident data","properties":{"assignees":{"description":"Current assignees","items":{"properties":{"html_url":{"type":"string"},"id":{"type":"string"},"self":{"type":"string"},"summary":{"type":"string"},"type":{"type":"string"}},"type":"object"},"type":"array"},"conference_bridge":{"description":"Conference bridge info (may be null)"},"created_at":{"description":"When the incident was created (ISO 8601)","type":"string"},"escalation_policy":{"description":"Escalation policy","properties":{"html_url":{"type":"string"},"id":{"type":"string"},"self":{"type":"string"},"summary":{"type":"string"},"type":{"type":"string"}},"type":"object"},"html_url":{"description":"URL to view the incident","type":"string"},"id":{"description":"Incident ID","type":"string"},"incident_key":{"description":"Incident deduplication key","type":"string"},"incident_type":{"description":"Incident type information","properties":{"name":{"type":"string"}},"type":"object"},"number":{"description":"Human-readable incident number","type":"number"},"priority":{"description":"Incident priority (may be null)"},"resolve_reason":{"description":"Resolution reason (may be null)"},"self":{"description":"API URL for this incident","type":"string"},"service":{"description":"Service associated with incident","properties":{"html_url":{"type":"string"},"id":{"type":"string"},"self":{"type":"string"},"summary":{"type":"string"},"type":{"type":"string"}},"type":"object"},"status":{"description":"Incident status","type":"string"},"teams":{"description":"Teams associated with incident","items":{"type":"object"},"type":"array"},"title":{"description":"Incident title","type":"string"},"type":{"description":"Resource type","type":"string"},"urgency":{"description":"Incident urgency","type":"string"}},"required":["id","number","title","status","urgency","created_at","html_url"],"type":"object"},"event_type":{"description":"Type of incident event (e.g., incident.triggered)","type":"string"},"id":{"description":"Unique identifier for the event","type":"string"},"occurred_at":{"description":"When the event occurred (ISO 8601)","type":"string"},"resource_type":{"description":"Type of resource (usually ''incident'')","type":"string"}},"required":["event_type","id","occurred_at","resource_type","data"],"type":"object"}}},"signals":{"subscriptionId":{"order":1,"name":"Subscription ID","description":"The ID of the webhook subscription","sensitive":false},"webhookUrl":{"order":0,"name":"Webhook URL","description":"The URL where PagerDuty sends webhook notifications","sensitive":false}},"hasOnSync":true,"hasOnDrain":true,"http":{"hasOnRequest":true},"hasOnTimer":false,"entrypoint":false}'
        # The above schema can be used if you attempt to create this block without a valid app installation referenced.
    position: [0, 0]
    config:
      serviceId: !expr '`PXXXXXX`'
      statuses: !expr '[`triggered`]'
  - name: Post Summary to Slack
    description: Posts the AI-written summary in the new incident channel.
    type:
      appBlock:
        block: sendTextMessage
        appInstallation: slack
