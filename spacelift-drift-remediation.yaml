appInstallations:
  jira:
    appName: Jira
    appVersion: 0.5.1
    id: 01a159f7-4d00-7d28-87e8-8c69adff439e
  slack:
    appName: Slack
    appVersion: 0.2.2
    id: 019f8016-da18-7a48-9b05-47d40818f160
blocks:
  - name: Any Drift?
    description: Skips the Slack summary when nothing drifted
    type:
      coreBlock: condition
    position: [0, 1200]
    inputs:
      default:
        links:
          - block: Collect Results
            output: default
        config: {}
  - name: Collect Pages
    description: Merges all pages of unconfirmed stacks into one list
    type:
      coreBlock: collect
    position: [0, 300]
    inputs:
      default:
        links:
          - block: Unconfirmed Stacks
            output: result
        config:
          group: !expr outputs.morningSchedule.time
          emit: !expr '!outputs.unconfirmedStacks.searchStacks.pageInfo.hasNextPage'
    outputs:
      default:
        outputCustomization: !expr raw.items.flatMap(item => item.unconfirmedStacks.searchStacks.edges.map(edge => edge.node))
  - name: Collect Results
    description: Waits until every stack has been processed, then emits the list
    type:
      coreBlock: collect
    position: [0, 1050]
    inputs:
      default:
        links:
          - block: Create Drift Ticket
            output: default
          - block: Is Drift Run?
            output: else
        config:
          group: !expr outputs.explode.groupKey
          count: !expr outputs.explode.count
  - name: Confirm Reconciliation Run
    description: Confirms the drift reconciliation run in Spacelift
    type:
      coreBlock: spacelift
      kind: confirmRun
    position: [400, 1650]
    inputs:
      confirm:
        links:
          - block: Remember Confirmation
            output: default
  - name: Confirmed From Slack?
    description: Ignores runs that weren't confirmed through the Slack button
    type:
      coreBlock: condition
    position: [800, 1650]
    inputs:
      default:
        links:
          - block: Lookup Confirmation
            output: default
        config: {}
  - name: Create Drift Ticket
    description: Opens a Jira ticket with the stack name, drifted resources and run link
    type:
      appBlock:
        block: createIssue
        appInstallation: jira
        schema: '{"order":0,"name":"Create Issue","category":"Issues","description":"Create a new Jira issue with specified details","config":{},"hasOnInternalMessage":false,"inputs":{"default":{"order":0,"config":{"additionalFields":{"order":8,"name":"Additional Fields","description":"Additional fields as a JSON object (for custom fields, components, etc.)","type":{"type":"object"},"fixed":false,"required":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"assigneeAccountId":{"order":5,"name":"Assignee Account ID","description":"Account ID of the user to assign the issue to (optional)","type":{"type":"string"},"fixed":false,"required":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"description":{"order":3,"name":"Description","description":"Detailed description of the issue (supports ADF format)","type":{"type":"string"},"fixed":false,"required":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"issueTypeName":{"order":1,"name":"Issue Type","description":"The name of the issue type (e.g., ''Bug'', ''Task'', ''Story'', ''Epic'')","type":{"type":"string"},"fixed":false,"required":true,"hasValidator":false,"hasSuggestValues":true,"fieldKey":"","sensitive":false},"labels":{"order":7,"name":"Labels","description":"Array of labels to add to the issue","type":{"items":{"type":{"type":"string"}},"type":"array"},"fixed":false,"required":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"parentKey":{"order":6,"name":"Parent Issue Key","description":"Key of the parent issue (for subtasks) or epic (for stories/tasks under an epic)","type":{"type":"string"},"fixed":false,"required":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"priorityName":{"order":4,"name":"Priority","description":"The priority level name (e.g., ''Low'', ''Medium'', ''High'', ''Critical''). Note: Priority field must be available on the Create Issue screen for this project/issue type.","type":{"type":"string"},"fixed":false,"required":false,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false},"projectKey":{"order":0,"name":"Project Key","description":"The key of the project where the issue will be created (e.g., ''PROJ'')","type":{"type":"string"},"fixed":false,"required":true,"hasValidator":false,"hasSuggestValues":true,"fieldKey":"","sensitive":false},"summary":{"order":2,"name":"Summary","description":"Brief title/summary of the issue","type":{"type":"string"},"fixed":false,"required":true,"hasValidator":false,"hasSuggestValues":false,"fieldKey":"","sensitive":false}},"hasOnEvent":true}},"outputs":{"default":{"order":0,"name":"Created Issue","description":"Details of the successfully created issue","default":true,"possiblePrimaryParents":["default"],"type":{"properties":{"issueId":{"description":"The ID of the created issue","order":0,"type":"string"},"issueKey":{"description":"The key of the created issue (e.g., PROJECT-123)","order":1,"type":"string"},"issueUrl":{"description":"The API URL of the created issue","order":2,"type":"string"}},"required":["issueId","issueKey","issueUrl"],"type":"object"}}},"signals":{},"hasOnSync":false,"hasOnDrain":false,"hasOnTimer":false,"entrypoint":false}'
        # The above schema can be used if you attempt to create this block without a valid app installation referenced.
    position: [-150, 900]
    inputs:
      default:
        links:
          - block: Is Drift Run?
            output: then
  - name: Each Stack
    description: Emits one event per unconfirmed stack
    type:
      coreBlock: explode
    position: [0, 450]
    inputs:
      default:
        links:
          - block: Collect Pages
            output: default
        config:
          items: !expr outputs.collectPages
          emittedLimit: 1000
  - name: Has Next Page?
    description: Loops back to fetch the next page of stacks
    type:
      coreBlock: condition
    position: [-300, 150]
    inputs:
      default:
        links:
          - block: Unconfirmed Stacks
            output: result
        config:
          condition: !expr outputs.unconfirmedStacks.searchStacks.pageInfo.hasNextPage
  - name: Is Drift Run?
    description: Only drift detection runs get a ticket; others skip straight to the collector
    type:
      coreBlock: condition
    position: [0, 750]
    inputs:
      default:
        links:
          - block: Run Details
            output: result
        config: {}
  - name: Lookup Confirmation
    description: Finds the Slack thread for the finished run, if it was confirmed from Slack
    type:
      coreBlock: memoryGet
    position: [800, 1500]
    inputs:
      default:
        links:
          - block: On Run Finished
            output: runs
        config:
          key: !expr outputs.block.key
          collection: default
  - name: Morning Schedule
    description: Fires every day at 8am
    type:
      coreBlock: schedule
    position: [0, 0]
    config:
      definition:
        type: cron
        cron:
          expression: 0 8 * * *
          location: UTC
  - name: On Run Finished
    description: Fires when any run reaches a terminal state
    type:
      coreBlock: spacelift
      kind: runEvents
    position: [800, 1350]
  - name: Post Drift Summary
    description: 'Posts the summary to #platform-ops with a Confirm button per stack'
    type:
      appBlock:
        block: sendMessageWithInteractions
        appInstallation: slack
