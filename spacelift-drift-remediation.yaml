    position: [0, 1350]
    inputs:
      default:
        links:
          - block: Any Drift?
            output: then
  - name: Remember Confirmation
    description: Stores the Slack thread for the run so the result can be posted back later
    type:
      coreBlock: memorySet
    position: [400, 1500]
    inputs:
      default:
        links:
          - block: Post Drift Summary
            output: interaction
        config:
          key: !expr outputs.block.key
          collection: default
          value: !expr '!stored ? 1 : stored + 1'
  - name: Reply Confirmed
    description: Replies in the thread that the run was confirmed
    type:
      appBlock:
        block: sendTextMessage
        appInstallation: slack
