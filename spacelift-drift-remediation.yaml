        # The above schema can be used if you attempt to create this block without a valid app installation referenced.
    position: [800, 1800]
    inputs:
      default:
        links:
          - block: Confirmed From Slack?
            output: then
  - name: Run Details
    description: Fetches the blocking run, drift flag and the planned resource changes
    type:
      coreBlock: spacelift
      kind: graphql
    position: [0, 600]
    config:
      query: !expr |-
        `query RunDetails($stack: ID!, $run: ID!) {
          stack(id: $stack) {
            id
            name
            run(id: $run) {
              id
              type
              state
              driftDetection
              changes {
                action
                phase
                entity { address type name }
              }
            }
          }
        }`
    inputs:
      request:
        links:
          - block: Each Stack
            output: default
  - name: Transform
    type:
      coreBlock: transform
    position: [0, 750]
    inputs:
      default:
        config: {}
  - name: Unconfirmed Stacks
    description: Searches Spacelift for stacks in the UNCONFIRMED state (paginated)
    type:
      coreBlock: spacelift
      kind: graphql
    position: [0, 150]
    config:
      query: !expr |-
        `query UnconfirmedStacks($input: SearchInput!) {
          searchStacks(input: $input) {
            edges {
              node {
                id
                name
                state
                stateSetBy
                stateSetAt
              }
            }
            pageInfo { hasNextPage endCursor }
          }
        }`
    inputs:
      request:
        links:
          - block: Has Next Page?
            output: then
          - block: Morning Schedule
            output: default
