","order":4,"properties":{"emoji":{"order":2,"type":"boolean"},"text":{"order":1,"type":"string"},"type":{"enum":["plain_text"],"order":0,"type":"string"}},"required":["type","text"],"type":"object"},"type":{"enum":["image"],"order":0,"type":"string"}},"required":["type","image_url","alt_text"],"type":"object"},{"additionalProperties":false,"description":"Actions block - container for interactive elements like buttons and select menus","properties":{"block_id":{"description":"Optional unique identifier for the block","order":1,"type":"string"},"elements":{"description":"Interactive elements (max 25)","items":{"properties":{"type":{"enum":["button","static_select","external_select","users_select","conversations_select","channels_select","overflow","datepicker","timepicker","datetime_select"],"order":0,"type":"string"}},"required":["type"],"type":"object"},"order":2,"type":"array"},"type":{"enum":["actions"],"order":0,"type":"string"}},"required":["type","elements"],"type":"object"},{"additionalProperties":false,"description":"Context block - displays contextual info with small text and images","properties":{"block_id":{"description":"Optional unique identifier for the block","order":1,"type":"string"},"elements":{"description":"Mix of text and image elements (max 10)","items":{"oneOf":[{"properties":{"emoji":{"order":2,"type":"boolean"},"text":{"order":1,"type":"string"},"type":{"enum":["mrkdwn","plain_text"],"order":0,"type":"string"}},"required":["type","text"],"type":"object"},{"properties":{"alt_text":{"order":2,"type":"string"},"image_url":{"order":1,"type":"string"},"type":{"enum":["image"],"order":0,"type":"string"}},"required":["type","image_url","alt_text"],"type":"object"}]},"order":2,"type":"array"},"type":{"enum":["context"],"order":0,"type":"string"}},"required":["type","elements"],"type":"object"},{"additionalProperties":false,"description":"Header block - displays large header text","properties":{"block_id":{"description":"Optional unique identifier for the block","order":1,"type":"string"},"text":{"description":"Header text (plain text only)","order":2,"properties":{"emoji":{"order":2,"type":"boolean"},"text":{"order":1,"type":"string"},"type":{"enum":["plain_text"],"order":0,"type":"string"}},"required":["type","text"],"type":"object"},"type":{"enum":["header"],"order":0,"type":"string"}},"required":["type","text"],"type":"object"},{"additionalProperties":false,"description":"Input block - collects user input in modals and forms","properties":{"block_id":{"description":"Optional unique identifier for the block","order":1,"type":"string"},"dispatch_action":{"description":"Whether to dispatch actions on character entry","order":6,"type":"boolean"},"element":{"description":"The input element","order":3,"properties":{"type":{"enum":["plain_text_input","email_text_input","url_text_input","number_input","static_select","multi_static_select","external_select","multi_external_select","users_select","multi_users_select","conversations_select","multi_conversations_select","channels_select","multi_channels_select","datepicker","timepicker","datetime_select","checkboxes","radio_buttons"],"order":0,"type":"string"}},"required":["type"],"type":"object"},"hint":{"description":"Optional hint text","order":4,"properties":{"emoji":{"order":2,"type":"boolean"},"text":{"order":1,"type":"string"},"type":{"enum":["plain_text"],"order":0,"type":"string"}},"required":["type","text"],"type":"object"},"label":{"description":"Label for the input element","order":2,"properties":{"emoji":{"order":2,"type":"boolean"},"text":{"order":1,"type":"string"},"type":{"enum":["plain_text"],"order":0,"type":"string"}},"required":["type","text"],"type":"object"},"optional":{"description":"Whether input is optional (default false)","order":5,"type":"boolean"},"type":{"enum":["input"],"order":0,"type":"string"}},"required":["type","label","element"],"type":"object"}]},"order":9,"type":"array"},"bot_id":{"description":"ID of a bot user (e.g., B0123ABC)."