y name of the category.","order":0,"type":"string"},"private":{"description":"Whether this category is private to certain users.","order":1,"type":"boolean"}},"required":["name","private","id"],"type":"object"},"postStatus":{"description":"Status information for a post (e.g., ''Under Review'', ''In Progress'', ''Completed'').","order":12,"properties":{"color":{"description":"Hex color code for the status (e.g., ''#FF5733'').","order":1,"pattern":"^#[0-9A-Fa-f]{6}$","type":"string"},"id":{"description":"Unique status ID.","order":4,"type":"string"},"isDefault":{"description":"Whether this is the default status for new posts.","order":3,"type":"boolean"},"name":{"description":"Display name of the status.","order":0,"type":"string"},"type":{"description":"Internal type identifier for the status.","order":2,"type":"string"}},"required":["name","color","type","isDefault","id"],"type":"object"},"postTags":{"description":"List of tags associated with the post.","items":{"properties":{"color":{"order":1,"type":"string"},"id":{"order":3,"type":"string"},"name":{"order":0,"type":"string"},"private":{"order":2,"type":"boolean"}},"type":"object"},"order":14,"type":"array"},"slug":{"description":"URL-friendly slug for the post.","order":3,"type":"string"},"title":{"description":"Title of the post.","order":1,"type":"string"},"upvotes":{"description":"Number of upvotes the post has received.","minimum":0,"order":4,"type":"integer"},"user":{"description":"Featurebase user object with profile information.","order":11,"properties":{"email":{"description":"User''s email address.","format":"email","order":1,"type":"string"},"id":{"description":"Unique user ID in Featurebase.","order":0,"type":"string"},"name":{"description":"Display name of the user.","order":2,"type":"string"},"profilePicture":{"description":"URL to the user''s profile picture, or null if not set.","format":"uri","order":3,"type":["string","null"]},"type":{"description":"User''s role type in the organization.","enum"