  - name: Format Triage Response
    description: Formats the triage response with Slack-compatible Markdown
    type:
      coreBlock: transform
    position: [1944, 1666]
    inputs:
      default:
        links:
          - block: Is spam?
            output: else
        config: {}
    outputs:
      default:
        outputCustomization: !expr "(function() {\n  const triage = outputs.triage.object;\n\n  const classificationEmojis = {\n    feature_request: \"✨\",\n    support_request: \"\U0001F91D\",\n    bug_report: \"\U0001F41B\",\n    spam: \"\U0001F6AB\"\n  };\n\n  const emoji = classificationEmojis[triage && triage.classification] || \"\U0001F4CB\";\n\n  const nextStepEmojis = {\n    send_to_solutions_engineering: \"\U0001F468\U0001F4BB\",\n    open_engineering_ticket: \"\U0001F527\",\n    open_support_ticket: \"\U0001F3AB\",\n    close: \"❌\",\n    ask_customer_for_more_data: \"❓\",\n    open_for_community_voting: \"\U0001F5F3\"\n  };\n\n  const nextStepLabels = {\n    send_to_solutions_engineering: \"Send to Solutions Engineering\",\n    open_engineering_ticket: \"Open Engineering Ticket\",\n    open_support_ticket: \"Open Support Ticket\",\n    close: \"Close\",\n    ask_customer_for_more_data: \"Ask Customer for More Data\",\n    open_for_community_voting: \"Open for Community Voting\"\n  };\n\n  const nextStepEmoji = nextStepEmojis[triage && triage.proposed_next_step] || \"\U0001F4CB\";\n  const nextStepLabel = nextStepLabels[triage && triage.proposed_next_step] || (triage && triage.proposed_next_step);\n\n  // Decode HTML entities; looped because the model sometimes double-escapes (&amp;lt;p&amp;gt;)\n  function decodeEntities(text) {\n    let s = text;\n    for (let i = 0; i < 3; i++) {\n      const prev = s;\n      s = s\n        .replace(/&amp;/g, '&')\n        .replace(/&lt;/g, '<')\n        .replace(/&gt;/g, '>')\n        .replace(/&quot;/g, '\"')\n        .replace(/&#0?39;/g, \"'\")\n        .replace(/&apos;/g, \"'\")\n        .replace(/&nbsp;/g, ' ');\n      if (s === prev) break;\n    }\n    return s;\n  }\n\n  // Convert HTML (possibly entity-escaped) to Slack mrkdwn; plain text passes through unchanged\n  function htmlToSlackMrkdwn(html) {\n    if (!html) return '';\n    return decodeEntities(html)\n      .replace(/<strong>(.*?)<\\/strong>/gs, '*$1*')\n      .replace(/<b>(.*?)<\\/b>/gs, '*$1*')\n      .replace(/<em>(.*?)<\\/em>/gs, '_$1_')\n      .replace(/<i>(.*?)<\\/i>/gs, '_$1_')\n      .replace(/<code>(.*?)<\\/code>/gs, '`$1`')\n      .replace(/<a\\s[^>]*href=\"([^\"]*)\"[^>]*>(.*?)<\\/a>/gs, '\\x01$1|$2\\x02')\n      .replace(/<li[^>]*>(.*?)<\\/li>/gs, '• $1\\n')\n      .replace(/<\\/?(ul|ol)[^>]*>\\s*/g, '\\n')\n      .replace(/<p[^>]*>(.*?)<\\/p>/gs, '$1\\n\\n')\n      .replace(/<br\\s*\\/?>/g, '\\n')\n      .replace(/<[^>]+>/g, '')\n      .replace(/\\x01/g, '<')\n      .replace(/\\x02/g, '>')\n      .replace(/\\n{3,}/g, '\\n\\n')\n      .trim();\n  }\n\n  // Convert Markdown (ClickUp ticket draft) to Slack mrkdwn\n  function markdownToSlackMrkdwn(md) {\n    if (!md) return '';\n    return md\n      .replace(/^#{1,6}\\s+(.+)$/gm, function(m, p1) { return '*' + p1.replace(/\\*\\*/g, '') + '*'; })\n      .replace(/\\*\\*([^*\\n]+)\\*\\*/g, '*$1*')\n      .replace(/__([^_\\n]+)__/g, '*$1*')\n      .replace(/~~([^~\\n]+)~~/g, '~$1~')\n      .replace(/\\[([^\\]]+)\\]\\(([^)\\s]+)\\)/g, '<$2|$1>')\n      .replace(/^(\\s*)[-*]\\s+/gm, '$1• ')\n      .trim();\n  }\n\n  const blocks: any[] = [];\n\n  // Slack section blocks cap at 3000 chars; split long text at word boundaries\n  function pushChunked(text) {\n    const chunkSize = 2800;\n    if (text.length <= chunkSize) {\n      blocks.push({ type: 'section', text: { type: 'mrkdwn', text: text } });\n      return;\n    }\n    const words = text.split(' ');\n    let currentChunk = '';\n    for (let i = 0; i < words.length; i++) {\n      const word = words[i];\n      if ((currentChunk + ' ' + word).length > chunkSize) {\n        if (currentChunk) {\n          blocks.push({ type: 'section', text: { type: 'mrkdwn', text: currentChunk.trim() } });\n          currentChunk = word;\n        } else {\n          blocks.push({ type: 'section', text: { type: 'mrkdwn', text: word } });\n        }\n      } else {\n        currentChunk += (currentChunk ? ' ' : '') + word;\n      }\n    }\n    if (currentChunk) {\n      blocks.push({ type: 'section', text: { type: 'mrkdwn', text: currentChunk.trim() } });\n    }\n  }\n\n  blocks.push({\n    type: 'header',\n    text: {\n      type: 'plain_text',\n      text: `${emoji} Triage Complete`,\n      emoji: true\n    }\n  });\n\n  blocks.push({ type: 'divider' });\n\n  const classification = triage && triage.classification ? triage.classification.replace(/_/g, ' ') : 'unknown';\n  const certainty = triage && triage.classification_certainty || 0;\n  blocks.push({\n    type: 'section',\n    text: {\n      type: 'mrkdwn',\n      text: `*Classification:* ${classification} (${certainty}% certainty)`\n    }\n  });\n\n  if (triage && triage.scope_team) {\n    blocks.push({\n      type: 'section',\n      text: {\n        type: 'mrkdwn',\n        text: `*Scope Team:* ${triage.scope_team}`\n      }\n    });\n  }\n\n  blocks.push({\n    type: 'section',\n    text: {\n      type: 'mrkdwn',\n      text: `*Proposed Next Step:* ${nextStepEmoji} ${nextStepLabel}`\n    }\n  });\n\n  if (triage && triage.proposed_ticket) {\n    blocks.push({\n      type: 'section',\n      text: {\n        type: 'mrkdwn',\n        text: '*Proposed Ticket:*'\n      }\n    });\n    pushChunked(markdownToSlackMrkdwn(triage.proposed_ticket));\n  }\n\n  if (triage && triage.build_engineering_team) {\n    blocks.push({\n      type: 'section',\n      text: {\n        type: 'mrkdwn',\n        text: `*Build Engineering Team:* ${triage.build_engineering_team}`\n      }\n    });\n  }\n\n  if (triage && triage.classification === 'feature_request' && triage.build_recommendation !== undefined) {\n    const buildEmoji = triage.build_recommendation >= 70 ? \"\U0001F680\" : triage.build_recommendation >= 40 ? \"\U0001F914\" : \"⛔\";\n    blocks.push({\n      type: 'section',\n      text: {\n        type: 'mrkdwn',\n        text: `*Build Recommendation:* ${buildEmoji} ${triage.build_recommendation}/100`\n      }\n    });\n    if (triage.build_justification) {\n      blocks.push({\n        type: 'section',\n        text: {\n          type: 'mrkdwn',\n          text: `> ${triage.build_justification}`\n        }\n      });\n    }\n  }\n\n  blocks.push({ type: 'divider' });\n\n  const dataScore = triage && triage.sufficient_data_score || 0;\n  const dataEmoji = dataScore >= 70 ? \"✅\" : dataScore >= 40 ? \"⚠️\" : \"❌\";\n  const dataJustification = triage && triage.sufficient_data_justification || 'No justification provided';\n  blocks.push({\n    type: 'section',\n    text: {\n      type: 'mrkdwn',\n      text: `*Data Sufficiency:* ${dataEmoji} ${dataScore}/100`\n    }\n  });\n  blocks.push({\n    type: 'section',\n    text: {\n      type: 'mrkdwn',\n      text: `> ${dataJustification}`\n    }\n  });\n\n  blocks.push({ type: 'divider' });\n\n  blocks.push({\n    type: 'section',\n    text: {\n      type: 'mrkdwn',\n      text: '*Proposed Response:*'\n    }\n  });\n\n  pushChunked(htmlToSlackMrkdwn(triage && triage.proposed_response || ''));\n\n  // PM notifications based on scope_team. IDs come from triage/context/team-routing.json via the Team routing block.\n  const scopeTeamName = triage && triage.scope_team ? triage.scope_team : '';\n  const route = scopeTeamName && outputs.teamRouting && outputs.teamRouting.teams ? outputs.teamRouting.teams[scopeTeamName] : null;\n\n  if (scopeTeamName) {\n    blocks.push({ type: 'divider' });\n    blocks.push({\n      type: 'section',\n      text: {\n        type: 'mrkdwn',\n        text: route && route.slack_pm_user_id\n          ? `\U0001F440 <@${route.slack_pm_user_id}> FYI — new ticket triaged above.`\n          : `⚠️ No PM mapping for team \"${scopeTeamName}\" in team-routing.json.`\n      }\n    });\n  }\n\n  return blocks;\n})()"
