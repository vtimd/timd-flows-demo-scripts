blocks:
  - name: Build prompt
    description: Assembles the ticket and the four GitHub context documents into the triage prompt.
    type:
      coreBlock: transform
    position: [1670, 796]
    inputs:
      default:
        links:
          - block: Team routing
            output: default
        config: {}
    outputs:
      default:
        outputCustomization: !expr |-
          (function () {
            const decode = (raw) => {
              const b64 = String(raw == null ? '' : raw).replace(/[^A-Za-z0-9+/=]/g, '');
              if (typeof atob === 'function') {
                try { return decodeURIComponent(escape(atob(b64))); } catch (e) {}
              }
              // pure-JS fallback: drop '=' padding, then decode by group size
              const s = b64.replace(/[^A-Za-z0-9+/]/g, '');
              const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
              const bytes = new Array();
              for (let i = 0; i < s.length; i += 4) {
                const a = A.indexOf(s[i]), b = A.indexOf(s[i + 1]),
                      c = A.indexOf(s[i + 2]), d = A.indexOf(s[i + 3]);
                const n = (a << 18) | (b << 12) | ((c & 63) << 6) | (d & 63);
                bytes.push((n >> 16) & 255);
                if (c !== -1) bytes.push((n >> 8) & 255);
                if (d !== -1) bytes.push(n & 255);
              }
              let out = '', j = 0;
              while (j < bytes.length) {
                const c1 = bytes[j++];
                if (c1 < 128) out += String.fromCharCode(c1);
                else if (c1 > 191 && c1 < 224) out += String.fromCharCode(((c1 & 31) << 6) | (bytes[j++] & 63));
                else if (c1 >= 224 && c1 < 240) out += String.fromCharCode(((c1 & 15) << 12) | ((bytes[j++] & 63) << 6) | (bytes[j++] & 63));
                else {
                  const u = (((c1 & 7) << 18) | ((bytes[j++] & 63) << 12) | ((bytes[j++] & 63) << 6) | (bytes[j++] & 63)) - 0x10000;
                  out += String.fromCharCode(0xD800 + (u >> 10), 0xDC00 + (u & 1023));
                }
              }
              return out;
            };
            const fileText = (file) => decode(file && file.content ? file.content : '');
            return `<ticket>${JSON.stringify(outputs.prepareTicket)}</ticket>

          <team_scopes>
          ${fileText(outputs.fetchTeamScopes)}
          </team_scopes>

          <pm_principles>
          ${fileText(outputs.fetchPrinciples)}
          </pm_principles>

          <current_work>
          ${fileText(outputs.fetchCurrentWork)}
          </current_work>

          <capabilities>
          ${fileText(outputs.fetchCapabilities)}
          </capabilities>`;
          })()
    errorHandler: Handle Error
