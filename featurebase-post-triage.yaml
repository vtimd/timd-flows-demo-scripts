    outputs:
      default:
        outputCustomization: !expr |-
          (function () {
            const FALLBACK = ["Platform", "Integrations", "Enterprise"];
            const read = (file) => {
              try {
                const raw = String(file && file.content ? file.content : '').replace(/[^A-Za-z0-9+/=]/g, '');
                const parsed = JSON.parse(decodeURIComponent(escape(atob(raw))));
                return parsed && parsed.teams ? parsed.teams : null;
              } catch (e) {
                return null;
              }
            };
            const teams = read(outputs.fetchTeamRouting);
            const names = teams ? Object.keys(teams) : new Array();
            return {
              ok: names.length > 0,
              teamNames: names.length > 0 ? names : FALLBACK,
              teams: teams || {}
            };
          })()
