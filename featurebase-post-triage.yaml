notes:
  - body: |-
      # Featurebase Post Triage

      Automatically triages new Featurebase posts using an AI "robotic PM", and keeps Slack in sync.

      **Flow at a glance**
      1. **Intake**: a new post is fetched, enriched, and a Slack thread is opened (mapping stored in memory).
      2. **Context**: product docs & team routing are fetched from GitHub and combined into a prompt.
      3. **Triage**: an LLM classifies the ticket, picks the owning team, scores it, and drafts a response.
      4. **Outcome**: spam (certainty > 90) is deleted; everything else is assigned to the owning team and the result is posted to Slack.
      5. **Comment sync**: new Featurebase comments are mirrored into the Slack thread.

      **Config**: *Instructions* (system prompt) and *Triage model* flow-local variables. *Handle Error* catches failures in the triage chain.
    position: [620, -745]
    style:
      width: 420
      height: 440
