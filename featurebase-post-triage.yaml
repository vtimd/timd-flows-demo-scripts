        # The above schema can be used if you attempt to create this block without a valid app installation referenced.
    position: [1122, 1972]
    inputs:
      default:
        links:
          - block: Mapping found?
            output: then
        config:
          channelId: !expr '`CXXXXXXXXXX`'
          text: !expr "(function() {\n  const c = outputs.commentCreated.comment;\n  let t = c.content || '';\n  for (let i = 0; i < 3; i++) {\n    const prev = t;\n    t = t\n      .replace(/&amp;/g, '&')\n      .replace(/&lt;/g, '<')\n      .replace(/&gt;/g, '>')\n      .replace(/&quot;/g, '\"')\n      .replace(/&#0?39;/g, \"'\")\n      .replace(/&apos;/g, \"'\")\n      .replace(/&nbsp;/g, ' ');\n    if (t === prev) break;\n  }\n  t = t\n    .replace(/<strong>(.*?)<\\/strong>/gs, '*$1*')\n    .replace(/<b>(.*?)<\\/b>/gs, '*$1*')\n    .replace(/<em>(.*?)<\\/em>/gs, '_$1_')\n    .replace(/<i>(.*?)<\\/i>/gs, '_$1_')\n    .replace(/<code>(.*?)<\\/code>/gs, '`$1`')\n    .replace(/<a\\s[^>]*href=\"([^\"]*)\"[^>]*>(.*?)<\\/a>/gs, '\\x01$1|$2\\x02')\n    .replace(/<li[^>]*>(.*?)<\\/li>/gs, '• $1\\n')\n    .replace(/<\\/?(ul|ol)[^>]*>\\s*/g, '\\n')\n    .replace(/<p[^>]*>(.*?)<\\/p>/gs, '$1\\n\\n')\n    .replace(/<br\\s*\\/?>/g, '\\n')\n    .replace(/<[^>]+>/g, '')\n    .replace(/\\x01/g, '<')\n    .replace(/\\x02/g, '>')\n    .replace(/\\n{3,}/g, '\\n\\n')\n    .trim();\n  return `\U0001F4AC *New comment by ${c.user.name}:*\\n\\n${t}`;\n})()"
          threadTs: !expr |-
            (outputs.getSlackThreadMapping.value || "").toString()
