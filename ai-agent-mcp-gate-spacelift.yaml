message not in a thread, this field is usually absent unless it becomes the parent of a new thread, in which case `thread_ts` would equal `ts`.","order":10,"type":"string"},"ts":{"description":"Timestamp of the message. This value is effectively the ID of the message in Slack''s API and is used to reference it in other operations (e.g., updating, deleting, threading).","order":2,"type":"string"},"type":{"description":"The type of the object, always ''message''.","enum":["message"],"order":0,"type":"string"},"user":{"description":"The user ID of the sender. For messages sent by a bot token, this is the bot''s user ID.","order":4,"type":"string"}},"required":["type","ts","text","user","bot_id","app_id","team","bot_profile","blocks"],"type":"object"},"ts":{"description":"Timestamp of the message. This value is effectively the ID of the message in Slack''s API and is used to reference it in other operations (e.g., updating, deleting, threading).","order":0,"type":"string"}},"required":["ts","channel","message"],"type":"object"}}},"signals":{},"hasOnSync":false,"hasOnDrain":false,"hasOnTimer":false,"entrypoint":false}'
        # The above schema can be used if you attempt to create this block without a valid app installation referenced.
    position: [750, 150]
    inputs:
      default:
        links:
          - block: trigger_run
            output: invocations
        config:
          blocks: !expr |-
            [
              {
                type: "header",
                text: { type: "plain_text", text: "Spacelift run approval request" }
              },
              {
                type: "section",
                fields: [
                  { type: "mrkdwn", text: `*Agent:*\n${outputs.triggerRun.arguments.agent_name || "(not provided)"}` },
                  { type: "mrkdwn", text: `*Called by:*\n${outputs.triggerRun.user.email}` },
                  { type: "mrkdwn", text: `*Stack:*\n\`${outputs.triggerRun.arguments.stack_id}\`` },
                  { type: "mrkdwn", text: "*Run type:*\nTRACKED (deploy)" }
                ]
              },
              {
                type: "section",
                text: { type: "mrkdwn", text: `*Reason:*\n${outputs.triggerRun.arguments.reason}` }
              },
              {
                type: "actions",
                elements: [
                  {
                    type: "button",
                    text: { type: "plain_text", text: "Approve" },
                    style: "primary",
                    action_id: "approve"
                  },
                  {
                    type: "button",
                    text: { type: "plain_text", text: "Reject" },
                    style: "danger",
                    action_id: "reject"
                  }
                ]
              }
            ]
          channelId: !expr secrets.SLACK_PLATFORM_APPROVALS_CHANNEL_ID
          text: !expr '`Approval needed: agent ${outputs.triggerRun.arguments.agent_name || outputs.triggerRun.user.email} wants to trigger a run on stack ${outputs.triggerRun.arguments.stack_id}. Reason: ${outputs.triggerRun.arguments.reason}`'
  - name: Start Run
    description: Starts a tracked run on the approved stack.
    type:
      coreBlock: spacelift
      kind: triggerRun
    position: [750, 600]
    inputs:
      trigger:
        links:
          - block: Log Approved
            output: default
        config:
          runType: !expr '`TRACKED`'
          stackId: !expr outputs.triggerRun.arguments.stack_id
  - name: Summarize Status
    description: Extracts latest run state and drift status from the stack query.
    type:
      coreBlock: transform
    position: [350, 300]
    inputs:
      default:
        links:
          - block: Fetch Stack Status
            output: result
        config: {}
    outputs:
      default:
        outputCustomization: !expr |-
          (function () {
            const stack = outputs.fetchStackStatus.stack;
            if (!stack) {
              return { found: false, stackId: outputs.getStackStatus.arguments.stack_id, error: "Stack not found" };
            }
            const runs = [...(stack.runs || [])].sort((a, b) => b.createdAt - a.createdAt);
            const latestRun = runs[0] || null;
            const latestDriftRun = runs.find((r) => r.driftDetection) || null;
            const terminal = ["FINISHED", "FAILED", "DISCARDED", "STOPPED", "CANCELED", "SKIPPED", "UNCONFIRMED"];
            let driftStatus = "unknown";
            if (latestDriftRun) {
              const d = latestDriftRun.delta;
              const changes = d ? d.addCount + d.changeCount + d.deleteCount : 0;
              if (!terminal.includes(latestDriftRun.state)) driftStatus = "check_in_progress";
              else if (latestDriftRun.state === "FAILED") driftStatus = "check_failed";
              else if (changes > 0) driftStatus = "drifted";
              else driftStatus = "in_sync";
            }
            const fmt = (r) => r && {
              id: r.id,
              type: r.type,
              state: r.state,
              createdAt: new Date(r.createdAt * 1000).toISOString(),
              driftDetection: r.driftDetection,
              delta: r.delta
            };
            return {
              found: true,
              stackId: stack.id,
              name: stack.name,
              stackState: stack.state,
              isDisabled: stack.isDisabled,
              latestRun: fmt(latestRun),
              drift: {
                status: driftStatus,
                latestDriftDetectionRun: fmt(latestDriftRun)
              }
            };
          })()
  - name: get_stack_status
    description: 'Read-only MCP tool: returns latest run state and drift status of a stack.'
    type:
      coreBlock: mcpTool
    position: [350, 0]
    config:
      inputSchema:
        stack_id:
          required: true
          type:
            description: The Spacelift stack ID (slug)
            type: string
    inputs:
      default:
        links:
          - block: Log Stack Status
            output: default
        config:
          responseBody: !expr outputs.summarizeStatus
  - name: list_stacks
    description: 'Read-only MCP tool: lists Spacelift stacks.'
    type:
      coreBlock: mcpTool
    position: [0, 0]
    config: {}
    inputs:
      default:
        links:
          - block: Log List Stacks
            output: default
        config:
          responseBody: !expr '{ stacks: outputs.fetchStacks.stacks }'
  - name: trigger_run
    description: 'MCP tool: triggers a run on a stack after human approval in Slack.'
    type:
      coreBlock: mcpTool
    position: [750, 0]
    config:
      inputSchema:
        agent_name:
          required: false
          type:
            description: Name of the calling AI agent, shown to the human approver
            type: string
        reason:
          required: true
          type:
            description: Why the run should be triggered; shown to the human approver
            type: string
        stack_id:
          required: true
          type:
            description: The Spacelift stack ID (slug) to trigger a tracked run on
            type: string
    inputs:
      default:
        links:
          - block: Log Rejected
            output: default
          - block: Start Run
            output: started
        config:
          responseBody: !expr |-
            outputs.startRun
              ? {
                  decision: "approved",
                  message: `Run ${outputs.startRun.runId} started on stack ${outputs.startRun.stackId}`,
                  runId: outputs.startRun.runId,
                  stackId: outputs.startRun.stackId,
                  state: outputs.startRun.state
                }
              : {
                  decision: "rejected",
                  message: `A human rejected the request to trigger a run on stack ${outputs.triggerRun.arguments.stack_id}. No run was started.`
                }
