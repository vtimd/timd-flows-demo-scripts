appInstallations:
  slack:
    appName: Slack
    appVersion: 0.2.2
    id: 019f8016-da18-7a48-9b05-47d40818f160
dataTables:
  mcptoolcallauditlog:
    id: 01a164e5-7f97-7bfd-94d1-18a6121a5511
    name: MCP Tool Call Audit Log
    schema:
      columns:
        - name: caller
          type: string
        - name: decided_by
          type: string
        - name: decision
          type: string
        - name: inputs
          type: json
        - name: tool
          type: string
blocks:
  - name: Check Decision
    description: Routes on whether the Approve button was clicked.
    type:
      coreBlock: condition
    position: [750, 300]
    inputs:
      default:
        links:
          - block: Request Approval
            output: interaction
        config:
          condition: !expr |-
            outputs.requestApproval.actions?.[0]?.action_id === "approve"
  - name: Fetch Stack Status
    description: Queries Spacelift for a stack's state, recent runs and drift detection info.
    type:
      coreBlock: spacelift
      kind: graphql
    position: [350, 150]
    config:
      query: !expr |-
        `query StackStatus($stackId: ID!) {
          stack(id: $stackId) {
            id
            name
            state
            isDisabled
            runs {
              id
              type
              state
              createdAt
              driftDetection
              delta {
                resources
                addCount
                changeCount
                deleteCount
              }
            }
          }
        }`
    inputs:
      request:
        links:
          - block: get_stack_status
            output: invocations
        config:
          variables.stackId: !expr outputs.getStackStatus.arguments.stack_id
  - name: Fetch Stacks
    description: Queries Spacelift for all stacks.
    type:
      coreBlock: spacelift
      kind: graphql
    position: [0, 150]
    config:
      query: !expr |-
        `query ListStacks {
          stacks {
            id
            name
            state
            branch
            repository
            space
            labels
          }
        }`
    inputs:
      request:
        links:
          - block: list_stacks
            output: invocations
  - name: Log Approved
    description: Audit log entry for an approved trigger_run call.
    type:
      coreBlock: dataTableCreateRow
    position: [750, 450]
    config:
      table: mcptoolcallauditlog
    inputs:
      default:
        links:
          - block: Check Decision
            output: then
        config:
          row: !expr |-
            { tool: "trigger_run", caller: outputs.triggerRun.user.email, inputs: outputs.triggerRun.arguments, decision: "approved", decided_by: outputs.requestApproval.user.username }
  - name: Log List Stacks
    description: Audit log entry for a list_stacks call.
    type:
      coreBlock: dataTableCreateRow
    position: [0, 450]
    config:
      table: mcptoolcallauditlog
    inputs:
      default:
        links:
          - block: Fetch Stacks
            output: result
        config:
          row: !expr |-
            { tool: "list_stacks", caller: outputs.listStacks.user.email, inputs: outputs.listStacks.arguments, decision: "n/a (read-only)" }
  - name: Log Rejected
    description: Audit log entry for a rejected trigger_run call.
    type:
      coreBlock: dataTableCreateRow
    position: [1100, 450]
    config:
      table: mcptoolcallauditlog
    inputs:
      default:
        links:
          - block: Check Decision
            output: else
        config:
          row: !expr |-
            { tool: "trigger_run", caller: outputs.triggerRun.user.email, inputs: outputs.triggerRun.arguments, decision: "rejected", decided_by: outputs.requestApproval.user.username }
  - name: Log Stack Status
    description: Audit log entry for a get_stack_status call.
    type:
      coreBlock: dataTableCreateRow
    position: [350, 450]
    config:
      table: mcptoolcallauditlog
    inputs:
      default:
        links:
          - block: Summarize Status
            output: default
        config:
          row: !expr |-
            { tool: "get_stack_status", caller: outputs.getStackStatus.user.email, inputs: outputs.getStackStatus.arguments, decision: "n/a (read-only)" }
  - name: Request Approval
    description: 'Posts approval request with Approve/Reject buttons to #platform-approvals.'
