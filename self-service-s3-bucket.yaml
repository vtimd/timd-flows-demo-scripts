        # The above schema can be used if you attempt to create this block without a valid app installation referenced.
    position: [1106, 1078]
    inputs:
      default:
        links:
          - block: Team Lead Approved
            output: then
        config:
          blocks: !expr "[\n  { type: 'header', text: { type: 'plain_text', text: '\U0001F4B0 Environment request — budget owner approval' } },\n  { type: 'section', fields: [\n    { type: 'mrkdwn', text: `*Project:*\\n${outputs.requestForm?.variables?.project_identifier}` },\n    { type: 'mrkdwn', text: `*Type:*\\n${outputs.requestForm?.variables?.env_type}` },\n    { type: 'mrkdwn', text: `*Engine:*\\n${outputs.requestForm?.variables?.engine}` },\n    { type: 'mrkdwn', text: `*Requester:*\\n${outputs.requestForm?.requestedBy}` }\n  ] },\n  { type: 'section', text: { type: 'mrkdwn', text: `*Justification:*\\n${outputs.requestForm?.variables?.justification}\\n✅ Team lead approved by @${outputs.teamLeadApproval?.user?.name}` } },\n  { type: 'actions', elements: [\n    { type: 'button', style: 'primary', text: { type: 'plain_text', text: 'Approve' }, action_id: 'approve', value: 'approve' },\n    { type: 'button', style: 'danger', text: { type: 'plain_text', text: 'Reject' }, action_id: 'reject', value: 'reject' }\n  ] }\n]"
          channelId: !expr secrets.SLACK_CHANNEL_ID
          text: !expr '`Environment request from ${outputs.requestForm?.requestedBy} — budget owner approval needed`'
  - name: Budget Owner Approved
    description: Routes on the budget owner's button choice.
    type:
      coreBlock: condition
    position: [1106, 1228]
    inputs:
      default:
        links:
          - block: Budget Owner Approval
            output: interaction
        config:
          condition: !expr outputs.budgetOwnerApproval.actions?.[0]?.action_id === 'approve'
  - name: Delete Deployment
    description: Deletes the template deployment (and its stacks) via the Spacelift GraphQL API.
    type:
      coreBlock: spacelift
      kind: graphql
    position: [1106, 1828]
    config:
      query: !expr |-
        `mutation DeleteDeployment($deploymentId: ID!, $templateId: ID!) {
          templateDeploymentDelete(id: $deploymentId, templateID: $templateId) {
            id
          }
        }`
    inputs:
      request:
        links:
          - block: Wait TTL
            output: default
        config:
          variables.deploymentId: !expr outputs.deployEnvironment?.deploymentId
          variables.templateId: !expr outputs.deployEnvironment?.templateId
  - name: Deploy Environment
    description: Deploys the Aurora Database Environment Spacelift template with form inputs.
    type:
      coreBlock: spacelift
      kind: deployTemplate
    position: [1106, 1378]
    config:
      templateId: !expr secrets.SPACELIFT_TEMPLATE_ID
    inputs:
      deploy:
        links:
          - block: Budget Owner Approved
            output: then
        config:
          inputs.database_name: !expr outputs.requestForm?.variables?.database_name
          inputs.engine: !expr outputs.requestForm?.variables?.engine
          inputs.project_identifier: !expr outputs.requestForm?.variables?.project_identifier
          name: !expr '`${outputs.requestForm?.variables?.project_identifier}-${outputs.requestForm?.variables?.env_type}`'
          space: !expr secrets.SPACELIFT_SPACE
  - name: Is Ephemeral
    description: Routes ephemeral environments to scheduled auto-teardown.
    type:
      coreBlock: condition
    position: [1106, 1528]
    inputs:
      default:
        links:
          - block: Deploy Environment
            output: completed
        config:
          condition: !expr outputs.requestForm.variables.env_type === 'ephemeral' && outputs.deployEnvironment.state === 'FINISHED'
