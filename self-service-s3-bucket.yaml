        # The above schema can be used if you attempt to create this block without a valid app installation referenced.
    position: [1406, 1528]
    inputs:
      default:
        links:
          - block: Deploy Environment
            output: completed
        config:
          channelId: !expr secrets.SLACK_CHANNEL_ID
          text: !expr |-
            (function() {
              const d = outputs.deployEnvironment;
              const f = outputs.requestForm?.variables;
              const who = outputs.requestForm?.requestedBy;
              if (d?.state !== 'FINISHED') {
                return `⚠️ Deployment "${d?.name}" for ${who} ended in state ${d?.state}.`;
              }
              const ttlNote = f?.env_type === 'ephemeral' ? `\n⏳ Auto-teardown in ${f?.ttl_minutes} minutes.` : '';
              return `✅ Environment "${d.name}" is ready for ${who}.\n\`\`\`${JSON.stringify(d.outputs, null, 2)}\`\`\`${ttlNote}`;
            })()
