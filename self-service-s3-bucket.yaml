          { name: "engine", label: "Database engine", type: "select", required: true, options: ["aurora-postgresql", "aurora-mysql"], default: "aurora-postgresql", description: "Aurora database engine" },
          { name: "database_name", label: "Database name", type: "string", required: true, default: "appdb", description: "Letters, digits, underscores" },
          { name: "env_type", label: "Environment type", type: "select", required: true, options: ["staging", "sandbox", "ephemeral"], default: "staging", description: "Ephemeral environments are torn down automatically after the TTL" },
          { name: "ttl_minutes", label: "TTL in minutes (ephemeral only)", type: "number", required: false, description: "1-1440, only used for ephemeral environments" },
          { name: "justification", label: "Justification", type: "text", required: true, description: "Why do you need this environment?" }
