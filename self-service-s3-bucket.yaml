    config:
      catalogItemDescription: !expr '`Request a new Aurora database environment. Project identifier: 3-30 chars, lowercase alphanumeric and hyphens, starting with a letter. Database name: letters, digits, underscores. Ephemeral TTL: 1-1440 minutes.`'
