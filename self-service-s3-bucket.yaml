        # The above schema can be used if you attempt to create this block without a valid app installation referenced.
    position: [1106, 778]
    inputs:
      default:
        links:
          - block: Validate Request
            output: then
        config:
          blocks: !expr "[\n  { type: 'header', text: { type: 'plain_text', text: '\U0001F3D7️ Environment request — team lead approval' } },\n  { type: 'section', fields: [\n    { type: 'mrkdwn', text: `*Project:*\\n${outputs.requestForm?.variables?.project_identifier}` },\n    { type: 'mrkdwn', text: `*Type:*\\n${outputs.requestForm?.variables?.env_type}` },\n    { type: 'mrkdwn', text: `*Engine:*\\n${outputs.requestForm?.variables?.engine}` },\n    { type: 'mrkdwn', text: `*Requester:*\\n${outputs.requestForm?.requestedBy}` }\n  ] },\n  { type: 'section', text: { type: 'mrkdwn', text: `*Justification:*\\n${outputs.requestForm?.variables?.justification}` } },\n  { type: 'actions', elements: [\n    { type: 'button', style: 'primary', text: { type: 'plain_text', text: 'Approve' }, action_id: 'approve', value: 'approve' },\n    { type: 'button', style: 'danger', text: { type: 'plain_text', text: 'Reject' }, action_id: 'reject', value: 'reject' }\n  ] }\n]"
          channelId: !expr secrets.SLACK_CHANNEL_ID
          text: !expr '`Environment request from ${outputs.requestForm?.requestedBy} — team lead approval needed`'
  - name: Team Lead Approved
    description: Routes on the team lead's button choice.
    type:
      coreBlock: condition
    position: [1106, 928]
    inputs:
      default:
        links:
          - block: Team Lead Approval
            output: interaction
        config:
          condition: !expr outputs.teamLeadApproval.actions?.[0]?.action_id === 'approve'
  - name: Validate Request
    description: 'Checks naming conventions: project identifier and database name regexes, TTL bounds for ephemeral environments.'
    type:
      coreBlock: condition
    position: [1106, 628]
    inputs:
      default:
        links:
          - block: Request Form
            output: default
        config:
          condition: !expr |-
            (function() {
              const d = outputs.requestForm.variables;
              const ttl = Number(d.ttl_minutes ?? 0);
              return /^[a-z][a-z0-9-]{1,28}[a-z0-9]$/.test(d.project_identifier || '')
                && /^[a-zA-Z][a-zA-Z0-9_]{0,62}$/.test(d.database_name || '')
                && (d.env_type !== 'ephemeral' || (ttl >= 1 && ttl <= 1440));
            })()
  - name: Wait TTL
    description: Sleeps for the requested TTL before tearing the environment down.
    type:
      coreBlock: sleep
    position: [1106, 1678]
    inputs:
      default:
        links:
          - block: Is Ephemeral
            output: then
        config:
          sleep: !expr Number(outputs.requestForm.variables.ttl_minutes ?? 2) * 60
